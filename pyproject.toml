[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mlx-moe-stream"
version = "0.1.0a2"
description = "Exact out-of-core MoE routing analysis and serving for MLX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "mlx-moe-stream contributors" }]
urls = { Repository = "https://github.com/IDAH-BITBOX/serve-mlx", Issues = "https://github.com/IDAH-BITBOX/serve-mlx/issues" }
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema>=4.23",
  "mlx>=0.32",
  "mlx-lm>=0.31",
  "numpy>=1.26",
  "safetensors>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
vlm = ["mlx-vlm>=0.6.15"]

[project.scripts]
mlx-moe-stream = "mlx_moe_stream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_moe_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
